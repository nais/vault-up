{{ if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vault-alerts
spec:
  groups:
    - name: nais-vault-alerts
      rules:
        - alert: VaultDown
          expr: probe_success{instance="https://{{ .Values.alerts.instance }}/v1/sys/health",job="blackbox-exporter"} == 0
          for: 5m
          labels:
            namespace: nais-system
            severity: critical
          annotations:
            consequence: {{ .Values.alerts.instance }} seems to be unreachable from the in-cluster probe.
            action: |
              * Check if the ingress is reachable, and if Vault is up and running.
              * See https://github.com/navikt/naisvakt/blob/master/vault.md#down for possible solutions.
        - alert: VaultServerDown
          expr:  vault_up{job="vault", vault_cluster="{{ .Values.envClass }}"} == 0
          for: 1m
          labels:
            namespace: nais-system
            severity: critical
          annotations:
            consequence: {{ "'Vault on {{ $labels.instance }} is down'" }}
            action: See https://github.com/navikt/naisvakt/blob/master/vault.md#down for possible solutions.
        - alert: VaultServerSealed
          expr: vault_sealed{job="vault", vault_cluster="{{ .Values.envClass }}"} == 1
          for: 1m
          labels:
            namespace: nais-system
            severity: critical
          annotations:
            consequence: {{ "'Vault on {{ $labels.instance }} is sealed'" }}
            action: See https://github.com/navikt/naisvakt/blob/master/vault.md#unsealing for unsealing.

{{ end }}
{{ if .Values.vault_up.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vault-up-alerts
spec:
  groups:
    - name: nais-vault-canary-alerts
      rules:
        - alert: vault-up-no-recent-success
          expr: |
            time() - (
              max by (k8s_cluster_name, namespace, cronjob) (
                kube_cronjob_status_last_successful_time{k8s_cluster_name="{{ .Values.env }}",namespace="{{ .Release.Namespace }}",cronjob="{{ .Release.Name }}"}
              )
              or
              max by (k8s_cluster_name, namespace, cronjob) (
                kube_cronjob_created{k8s_cluster_name="{{ .Values.env }}",namespace="{{ .Release.Namespace }}",cronjob="{{ .Release.Name }}"}
              )
            ) > 300
          for: 1m
          labels:
            namespace: {{ .Release.Namespace }}
            severity: critical
          annotations:
            consequence: "The Vault canary has not completed successfully for over five minutes."
            action: "Check canary Job events, Vault init-container logs and secret-validation logs."
        - alert: vault-up-missing
          expr: absent(kube_cronjob_created{k8s_cluster_name="{{ .Values.env }}",namespace="{{ .Release.Namespace }}",cronjob="{{ .Release.Name }}"})
          for: 5m
          labels:
            namespace: {{ .Release.Namespace }}
            severity: critical
          annotations:
            consequence: "The Vault canary CronJob is missing from kube-state-metrics."
            action: "Check the Naisjob, Naiserator reconciliation and kube-state-metrics."

{{ end }}
