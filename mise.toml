[settings]
pin = true

[tools]
go = "1.27.3"
helm = "4.3.1"
yq = "4.54.1"
promtool = "3.15.1"
"go:github.com/sethvargo/ratchet" = "0.12.0"
"go:github.com/rhysd/actionlint/cmd/actionlint" = "1.7.12"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

[tasks.build]
description = "Build the canary binary"
run = "go build -trimpath -ldflags='-s -w' -o bin/vault-up ."

[tasks.version]
description = "Generate the release version"
run = 'echo "$(date +%Y%m%d%H%M%S)-$(git rev-parse --short HEAD)"'

[tasks.test]
description = "Run tests with the race detector"
run = "go test -race -cover ./..."

[tasks.check]
description = "Run static checks"
depends = ["check:govet", "check:govulncheck", "check:actions", "check:helm", "check:dashboard"]

[tasks."check:govet"]
run = "go vet ./..."

[tasks."check:govulncheck"]
run = "govulncheck ./..."

[tasks."check:actions"]
run = ["ratchet lint .github/workflows/*.yaml", "actionlint"]

[tasks."check:helm"]
run = "bash tests/check-chart.sh"

[tasks."check:dashboard"]
run = "bash tests/check-dashboard.sh"

[tasks."actions:upgrade"]
description = "Upgrade and pin GitHub Actions"
run = "ratchet upgrade .github/workflows/*.yaml"
