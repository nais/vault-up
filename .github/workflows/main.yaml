name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  build:
    permissions:
      contents: write
      id-token: write
    uses: nais/actions/.github/workflows/mise-build-deploy-fasit.yaml@d552cb1cb4084c5804d7d47a075c645c674c351e # ratchet:nais/actions/.github/workflows/mise-build-deploy-fasit.yaml@main
    with:
      mise-tasks: '["check", "test"]'
      builds-docker: ${{ github.event_name == 'push' }}
      builds-chart: ${{ github.event_name == 'push' }}
      deploys-to-fasit: true
      chart-repo: nais-io/nais/feature
      helm-version: v4.3.1
      targets: |
        [
          { "target": { "kind": "onprem", "tenant": "ci-nais" }, "wait": true },
          { "target": { "kind": "onprem" } }
        ]
    secrets:
      NAIS_IO_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
